[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-query-performance-lab"
version = "0.1.0"
description = "Reproducible PostgreSQL query plan and indexing lab"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
generate-performance-data = "performance_lab.generator:main"
benchmark-performance-lab = "performance_lab.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

