name: benchmark-postgresql
on: [push, pull_request, workflow_dispatch]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: performance_lab
          POSTGRES_USER: lab_user
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab_user -d performance_lab"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://lab_user:test-password@localhost:5432/performance_lab
      ORDER_COUNT: 100000
      REPEATS: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: bash scripts/run_postgres_benchmark.sh
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-benchmark-results
          path: reports/generated/
